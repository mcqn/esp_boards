# Devices Configuration
devices:
  - name: led_strip_0
    chip: ws2812
    type: led_strip
    sub_type: rmt
    init_skip: false
    config:
      strip_gpio_num: 5
      max_leds: 100
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  - name: audio_codec_0
    chip: INMP441
    type: audio_codec
    init_skip: false
    config:
      adc_enabled: false
      sys_cfg:
        is_master: false
        no_mclk: true
      adc_cfg:
        digital_mic: false
        label: []
      dac_cfg:
        ref_enable: false
        ref_dac_ch: 0
        real_adc_data_ch: 0
    peripherals:
      - i2s_name: i2s_0
