# Peripherals Configuration
peripherals:
  - name: i2s_0
    type: i2s
    role: master
    format: std-out
    config:
      sample_rate_hz: 48000
      clk_src: I2S_CLK_SRC_DEFAULT
      ext_clk_freq_hz: 0
      mclk_multiple: 256
      bclk_div: 8
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      ws_width: 0
      ws_pol: false
      bit_shift: true
      left_align: false
      big_endian: false
      bit_order_lsb: false
      pins:
        mclk: -1
        bclk: 4
        ws: 6
        dout: 5
        din: -1
      invert_flags:
        mclk_inv: false
        bclk_inv: false
        ws_inv: false
      port: 0

  - name: i2c_0
    type: i2c
    config:
      port: -1
      clk_source: I2C_CLK_SRC_DEFAULT
      pins:
        sda: 8
        scl: 9
      enable_internal_pullup: false
      glitch_count: 7
      intr_priority: 1

  - name: spi_0
    type: spi
    config:
      spi_bus_config:
        spi_port: SPI1_HOST
        data0_io_num: 11
        data1_io_num: 13
        sclk_io_num: 12
        data2_io_num: -1
        data3_io_num: -1
        data4_io_num: -1
        data5_io_num: -1
        data6_io_num: -1
        data7_io_num: -1
        data_io_default_level: false
        max_transfer_sz: 4092
        flags: 0
        isr_cpu_id: ESP_INTR_CPU_AFFINITY_AUTO
        intr_flags: 0
